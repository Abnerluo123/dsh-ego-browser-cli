# dsh-ego-browser-cli bundle patch.
#
# One insert row mounts the Host half. The plugin needs only `tools`.
#
# `requireApproval` modes:
#   block  (default) — a script that leaves the browser surface is refused with
#                      guidance; nobody is interrupted. Host work belongs on the
#                      normal pwsh/file tools, which apply the session sandbox and
#                      their own approval policy.
#   ask             — raise one approval request per offending call instead.
#   never           — disable the browser/host check entirely.
#
# `executable` is deliberately NOT set: the plugin locates ego-browser itself,
# following the junction ego's own onboarding creates
# (~/.local/share/ego/active_version_dir), then PATH. That keeps this patch
# portable across machines and across ego upgrades. Set `executable` only to
# override a non-standard install layout.
- insert:
    - id: ego-browser-cli
      name: dsh-ego-browser-cli
      config:
        requireApproval: block
        timeoutMs: 240000
